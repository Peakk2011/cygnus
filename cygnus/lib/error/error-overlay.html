<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cygnus Error</title>
    <link rel="stylesheet" href="__OVERLAY_CSS__">
</head>

<body>

    <div class="backdrop">
        <div class="receipt">

            <div class="header">
                <span class="logo">
                    <svg width="16" height="18" viewBox="0 0 16 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <line x1="9" y1="16.4141" x2="6" y2="16.4141" stroke="black" stroke-width="2" />
                        <line x1="12" y1="13.4141" x2="3" y2="13.4141" stroke="black" stroke-width="2" />
                        <line x1="11" y1="8.41406" x2="11" y2="12.4141" stroke="black" stroke-width="2" />
                        <path d="M11 8.41406L11 2.41406C11.8333 3.2474 14 4.91406 16 4.91406" stroke="black"
                            stroke-width="2" />
                        <line x1="9" y1="10.4141" x2="-8.74238e-08" y2="10.4141" stroke="black" stroke-width="2" />
                        <line x1="14" y1="7.41406" x2="12" y2="7.41406" stroke="black" stroke-width="2" />
                    </svg>
                    <p>CYGNUS</p>
                </span>
                <span class="header-label">__ERROR_COUNT__</span>
                <span class="loc">line __LINE__ &nbsp; col __COL__</span>
            </div>

            <hr class="divider">

            __ERRORS_HTML__

            <div class="footer footer-help">
                <span class="footer-label" id="footer-label-help">If you tried to figure the problem with yourself and
                    you can't do it? call me:</span>
                <a class="footer-call" href="tel:+6680380449">+66 0803804449</a>
            </div>

            <hr class="divider">

            <div class="footer" id="footer-last">
                <span class="footer-label">cygnus preprocessor</span>
                <span class="footer-label">check syntax reference</span>
            </div>

        </div>
    </div>

    <script>
        // Typing effect on first error message only
        const MSG = __MSG_JSON__;
        const target = document.getElementById('cy-msg-0');

        if (target) {
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            target.appendChild(cursor);

            let i = 0;
            const tick = () => {
                if (i >= MSG.length) {
                    cursor.classList.add('done');
                    return;
                }
                const span = document.createElement('span');
                span.textContent = MSG[i];
                target.insertBefore(span, cursor);
                i++;
                setTimeout(tick, 22);
            };

            tick();
        }
    </script>

</body>

</html>
